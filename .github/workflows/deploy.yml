name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Automated Tests
      run: |
        pytest
      env:
        PYTHONPATH: .

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract Short Git SHA for Unique Tagging
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/shopping-bill:${{ steps.vars.outputs.sha_short }}

    - name: Prepare K8s Deployment Manifest
      run: |
        sed -i "s|lakshitha119/shopping-bill:IMAGE_TAG|${{ secrets.DOCKER_USERNAME }}/shopping-bill:${{ steps.vars.outputs.sha_short }}|g" k8s/deployment.yml

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Deploy to Kubernetes Cluster
      run: |
        kubectl apply -f k8s/deployment.yml
        kubectl apply -f k8s/service.yml
